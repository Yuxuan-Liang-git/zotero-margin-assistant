<html xmlns="http://www.w3.org/1999/xhtml">
<head><title>DeepSeek 设置</title><style>body{font:14px/1.6 system-ui;padding:20px;min-width:400px}input{display:block;width:95%;padding:8px;margin:8px 0}button{padding:7px;margin:5px}#status{white-space:pre-wrap}</style><script src="chrome://margincomments/content/scripts/assistant-settings.js"></script></head>
<body><div id="zma-api-settings"><h2>DeepSeek API</h2><p>服务地址：https://api.deepseek.com</p><label for="zma-api-key">API Key（加密保存在本机）</label><input id="zma-api-key" type="password" autocomplete="off"/><label for="zma-api-model">模型（需要支持图片输入）</label><input id="zma-api-model" value="deepseek-flash"/><p>重启后自动读取密钥。图片只在你点击“发送”后上传。</p><button id="zma-api-apply">应用设置</button><button id="zma-api-test">测试连接</button><button id="zma-api-clear">清除密钥</button><p id="zma-api-status" role="status"></p></div></body></html>
